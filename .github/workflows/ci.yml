name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test --workspace=packages/core
      - run: npm test --workspace=packages/cli
      - run: npm test --workspace=packages/mcp
      - run: npx tsc -p packages/extension --noEmit
      - run: npm run bundle --workspace=packages/extension
